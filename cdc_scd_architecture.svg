<svg width="2050" height="1150" viewBox="0 0 2050 1150" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#000000" stroke="none"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#666666" stroke="none"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="2050" height="1150" fill="#ffffff"/>
  <text x="1025" y="30" text-anchor="middle" font-size="16" font-weight="700">CDC + Slowly Changing Dimensions — Architecture</text>
  <text x="1025" y="50" text-anchor="middle" font-size="12" fill="#444">Operational DB → Change Data Feed / Streams → MERGE upserts → SCD Type 2 (Silver) → Dimensional Model (Gold)</text>

  <!-- ============ Actor: Analyst / BI Consumer (placed outside Gold box) ============ -->
  <circle cx="1955" cy="250" r="14" fill="none" stroke="#555" stroke-width="1.5"/>
  <path d="M1932 300 q23 -30 46 0" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="1955" y1="264" x2="1955" y2="292" stroke="#555" stroke-width="1.5"/>
  <text x="1955" y="328" text-anchor="middle" font-size="12" font-weight="700">Analyst /</text>
  <text x="1955" y="342" text-anchor="middle" font-size="12" font-weight="700">BI Consumer</text>

  <!-- ============ 1. Source System ============ -->
  <rect x="40" y="100" width="280" height="360" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="60" y="124" font-size="14" font-weight="700">1. Source System</text>

  <rect x="90" y="160" width="90" height="90" rx="8" fill="#336791"/>
  <text x="135" y="212" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">DB</text>
  <text x="135" y="272" text-anchor="middle" font-size="12" font-weight="700">Operational DB</text>
  <rect x="70" y="280" width="130" height="16" fill="#ffffff"/>
  <text x="135" y="292" text-anchor="middle" font-size="11">(Postgres / MySQL)</text>

  <rect x="90" y="330" width="90" height="90" rx="8" fill="#555555"/>
  <text x="135" y="378" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">SIM</text>
  <text x="135" y="440" text-anchor="middle" font-size="12" font-weight="700">Change Simulator</text>
  <rect x="65" y="446" width="140" height="16" fill="#ffffff"/>
  <text x="135" y="458" text-anchor="middle" font-size="11">(inserts/updates/deletes)</text>

  <line x1="135" y1="330" x2="135" y2="250" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="95" y="282" width="80" height="16" fill="#ffffff"/>
  <text x="135" y="294" text-anchor="middle" font-size="11">writes rows</text>

  <!-- Source -> CDC capture -->
  <path d="M320 210 L400 210" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="325" y="192" width="70" height="16" fill="#ffffff"/>
  <text x="360" y="204" text-anchor="middle" font-size="11" font-weight="700">row changes</text>

  <!-- ============ 2. CDC Capture ============ -->
  <rect x="400" y="100" width="330" height="360" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="420" y="124" font-size="14" font-weight="700">2. CDC Capture</text>

  <rect x="440" y="160" width="110" height="90" rx="8" fill="#FF3621"/>
  <text x="495" y="200" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">Delta</text>
  <text x="495" y="220" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">CDF</text>
  <text x="495" y="272" text-anchor="middle" font-size="12" font-weight="700">Delta Change</text>
  <text x="495" y="286" text-anchor="middle" font-size="12" font-weight="700">Data Feed</text>
  <rect x="415" y="292" width="160" height="16" fill="#ffffff"/>
  <text x="495" y="304" text-anchor="middle" font-size="11">(Bronze table, versioned)</text>

  <rect x="590" y="160" width="110" height="90" rx="8" fill="#29B5E8"/>
  <text x="645" y="205" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">Streams</text>
  <text x="645" y="272" text-anchor="middle" font-size="12" font-weight="700">Snowflake</text>
  <text x="645" y="286" text-anchor="middle" font-size="12" font-weight="700">Streams</text>
  <rect x="575" y="292" width="140" height="16" fill="#ffffff"/>
  <text x="645" y="304" text-anchor="middle" font-size="11">(alt. table stream)</text>

  <rect x="440" y="340" width="260" height="90" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="570" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="700">Ingestion (Autoloader / COPY)</text>
  <text x="570" y="386" text-anchor="middle" font-size="11" fill="#444">lands raw operational changes</text>
  <text x="570" y="402" text-anchor="middle" font-size="11" fill="#444">into a versioned Bronze table</text>
  <line x1="570" y1="250" x2="570" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CDC -> Transform -->
  <path d="M730 210 L800 210" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="735" y="192" width="90" height="16" fill="#ffffff"/>
  <text x="780" y="204" text-anchor="middle" font-size="11" font-weight="700">change feed read</text>

  <!-- ============ 3. Transform & Upsert ============ -->
  <rect x="800" y="100" width="330" height="360" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="820" y="124" font-size="14" font-weight="700">3. Transform &amp; Upsert</text>

  <rect x="840" y="160" width="110" height="90" rx="8" fill="#FF3621"/>
  <text x="895" y="200" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Job</text>
  <text x="895" y="220" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">MERGE</text>
  <text x="895" y="272" text-anchor="middle" font-size="12" font-weight="700">Databricks Job</text>
  <rect x="815" y="278" width="160" height="16" fill="#ffffff"/>
  <text x="895" y="290" text-anchor="middle" font-size="11">(MERGE INTO logic)</text>

  <rect x="990" y="160" width="110" height="90" rx="8" fill="#FF694B"/>
  <text x="1045" y="205" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">dbt</text>
  <text x="1045" y="272" text-anchor="middle" font-size="12" font-weight="700">dbt snapshot</text>
  <rect x="965" y="278" width="160" height="16" fill="#ffffff"/>
  <text x="1045" y="290" text-anchor="middle" font-size="11">(alt. snapshot strategy)</text>

  <rect x="840" y="340" width="260" height="100" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="970" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="700">Upsert logic (per surrogate key)</text>
  <text x="970" y="380" text-anchor="middle" font-size="11" fill="#444">1. Hash compare changed columns</text>
  <text x="970" y="396" text-anchor="middle" font-size="11" fill="#444">2. Expire old row (set valid_to)</text>
  <text x="970" y="412" text-anchor="middle" font-size="11" fill="#444">3. Insert new current row</text>
  <line x1="970" y1="250" x2="970" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Transform -> Silver -->
  <path d="M1130 210 L1200 210" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1135" y="192" width="70" height="16" fill="#ffffff"/>
  <text x="1170" y="204" text-anchor="middle" font-size="11" font-weight="700">MERGE ops</text>

  <!-- ============ 4. Silver - SCD Type 2 ============ -->
  <rect x="1200" y="100" width="330" height="360" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="1220" y="124" font-size="14" font-weight="700">4. Silver — SCD Type 2</text>

  <rect x="1250" y="160" width="230" height="150" rx="6" fill="none" stroke="#FF3621" stroke-width="1.6"/>
  <text x="1365" y="184" text-anchor="middle" font-size="12" font-weight="700">dim_customer_history</text>
  <text x="1270" y="208" font-size="11">business_key</text>
  <text x="1270" y="226" font-size="11">attribute_columns...</text>
  <text x="1270" y="244" font-size="11" font-weight="700" fill="#B3271A">valid_from</text>
  <text x="1270" y="262" font-size="11" font-weight="700" fill="#B3271A">valid_to</text>
  <text x="1270" y="280" font-size="11" font-weight="700" fill="#B3271A">is_current</text>
  <text x="1270" y="298" font-size="11" font-weight="700" fill="#B3271A">row_hash</text>

  <rect x="1250" y="340" width="230" height="90" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1365" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="700">Full history preserved</text>
  <text x="1365" y="380" text-anchor="middle" font-size="11" fill="#444">every prior version of a</text>
  <text x="1365" y="396" text-anchor="middle" font-size="11" fill="#444">dimension row is queryable</text>
  <text x="1365" y="412" text-anchor="middle" font-size="11" fill="#444">as-of any point in time</text>
  <line x1="1365" y1="310" x2="1365" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Silver -> Gold -->
  <path d="M1530 210 L1600 210" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1535" y="192" width="60" height="16" fill="#ffffff"/>
  <text x="1565" y="204" text-anchor="middle" font-size="11" font-weight="700">dbt model</text>

  <!-- ============ 5. Gold - Dimensional Model ============ -->
  <rect x="1600" y="100" width="270" height="360" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="1620" y="124" font-size="14" font-weight="700">5. Gold — Dim. Model</text>

  <rect x="1640" y="160" width="190" height="70" rx="6" fill="none" stroke="#FF694B" stroke-width="1.6"/>
  <text x="1735" y="184" text-anchor="middle" font-size="12" font-weight="700">dim_customer</text>
  <text x="1735" y="202" text-anchor="middle" font-size="11">(current-state view,</text>
  <text x="1735" y="216" text-anchor="middle" font-size="11">is_current = true)</text>

  <rect x="1640" y="250" width="190" height="70" rx="6" fill="none" stroke="#FF694B" stroke-width="1.6"/>
  <text x="1735" y="274" text-anchor="middle" font-size="12" font-weight="700">fact_bookings</text>
  <text x="1735" y="292" text-anchor="middle" font-size="11">(joins to dimension</text>
  <text x="1735" y="306" text-anchor="middle" font-size="11">surrogate keys)</text>

  <line x1="1735" y1="230" x2="1735" y2="250" stroke="#000" stroke-width="1.2"/>

  <rect x="1650" y="340" width="170" height="90" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1735" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="700">Clean star schema</text>
  <text x="1735" y="380" text-anchor="middle" font-size="11" fill="#444">tested with dbt,</text>
  <text x="1735" y="396" text-anchor="middle" font-size="11" fill="#444">exposed to BI tools</text>
  <line x1="1735" y1="320" x2="1735" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Gold -> Analyst -->
  <path d="M1870 290 L1928 260" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1865" y="255" width="80" height="16" fill="#ffffff"/>
  <text x="1905" y="267" text-anchor="middle" font-size="11" font-weight="700">SQL queries</text>

  <!-- ============ 6. Orchestration (spans below, controls 2-5) ============ -->
  <rect x="400" y="520" width="1470" height="200" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="420" y="544" font-size="14" font-weight="700">6. Orchestration</text>

  <rect x="450" y="580" width="140" height="90" rx="8" fill="#FF3621"/>
  <text x="520" y="618" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Workflows</text>
  <text x="520" y="638" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">(Jobs)</text>
  <text x="520" y="690" text-anchor="middle" font-size="12" font-weight="700">Databricks Workflows</text>

  <rect x="640" y="580" width="140" height="90" rx="8" fill="#FF694B"/>
  <text x="710" y="620" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">dbt Cloud</text>
  <text x="710" y="638" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">(scheduled run)</text>
  <text x="710" y="690" text-anchor="middle" font-size="12" font-weight="700">dbt orchestration</text>

  <rect x="900" y="580" width="800" height="90" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1300" y="605" text-anchor="middle" font-size="11" fill="#444" font-weight="700">Schedule triggers, in order: 1) CDC read job  2) MERGE upsert job  3) dbt run/snapshot  4) dbt test</text>
  <text x="1300" y="625" text-anchor="middle" font-size="11" fill="#444">Idempotent MERGE keys ensure re-runs never duplicate history rows</text>
  <text x="1300" y="645" text-anchor="middle" font-size="11" fill="#444">Failure alerts on broken SCD2 invariants (overlapping valid ranges, &gt;1 current row per key)</text>

  <!-- orchestration control lines up into pipeline stages -->
  <path d="M520 580 L520 470 L570 460" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <path d="M710 580 L710 470 L970 460" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <path d="M780 580 L780 490 L1365 460" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <path d="M780 620 L1735 620 L1735 460" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <rect x="530" y="500" width="90" height="16" fill="#ffffff"/>
  <text x="575" y="512" text-anchor="middle" font-size="10" fill="#444">triggers</text>

  <!-- ============ 7. Validation & Data Quality ============ -->
  <rect x="40" y="520" width="330" height="360" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="60" y="544" font-size="14" font-weight="700">7. Validation &amp; DQ</text>

  <rect x="80" y="580" width="110" height="90" rx="8" fill="#FF694B"/>
  <text x="135" y="620" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">dbt test</text>
  <text x="135" y="682" text-anchor="middle" font-size="12" font-weight="700">Uniqueness /</text>
  <text x="135" y="696" text-anchor="middle" font-size="12" font-weight="700">not-null checks</text>

  <rect x="230" y="580" width="110" height="90" rx="8" fill="#555555"/>
  <text x="285" y="620" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Audit</text>
  <text x="285" y="682" text-anchor="middle" font-size="12" font-weight="700">One current row</text>
  <text x="285" y="696" text-anchor="middle" font-size="12" font-weight="700">per business key</text>

  <rect x="80" y="720" width="260" height="120" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="210" y="744" text-anchor="middle" font-size="11" fill="#444" font-weight="700">Checks run after every load:</text>
  <text x="210" y="764" text-anchor="middle" font-size="11" fill="#444">no overlapping valid_from/valid_to,</text>
  <text x="210" y="782" text-anchor="middle" font-size="11" fill="#444">exactly one is_current=true row</text>
  <text x="210" y="800" text-anchor="middle" font-size="11" fill="#444">per key, row counts reconcile</text>
  <text x="210" y="818" text-anchor="middle" font-size="11" fill="#444">against source change volume</text>

  <path d="M210 670 L210 720" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M370 665 L1365 430" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <rect x="700" y="580" width="90" height="16" fill="#ffffff"/>
  <text x="745" y="592" text-anchor="middle" font-size="11" fill="#444">validates Silver</text>

  <!-- ============ Legend ============ -->
  <rect x="40" y="920" width="1980" height="180" fill="none" stroke="#000" stroke-width="1"/>
  <text x="60" y="944" font-size="13" font-weight="700">Stack</text>
  <text x="60" y="970" font-size="12">Databricks: Delta Lake + Change Data Feed, Databricks Jobs (MERGE INTO), Databricks Workflows for orchestration</text>
  <text x="60" y="992" font-size="12">Snowflake (alternative): Streams + Tasks in place of Delta CDF, same MERGE-based upsert pattern</text>
  <text x="60" y="1014" font-size="12">dbt: snapshots as a lighter-weight alternative to hand-written MERGE for SCD Type 2, plus dbt tests for validation</text>
  <text x="60" y="1042" font-size="13" font-weight="700">Key idea</text>
  <text x="60" y="1064" font-size="12">Bronze captures raw change events; Silver is the append-only SCD2 history table; Gold exposes only the current-state,</text>
  <text x="60" y="1084" font-size="12">query-friendly dimensional model — history lives once, in Silver, and never needs to be rebuilt from scratch.</text>

  <!-- source dashed color key -->
  <rect x="1550" y="944" width="14" height="14" fill="#FF3621"/>
  <text x="1572" y="956" font-size="12">Databricks</text>
  <rect x="1550" y="966" width="14" height="14" fill="#29B5E8"/>
  <text x="1572" y="978" font-size="12">Snowflake</text>
  <rect x="1550" y="988" width="14" height="14" fill="#FF694B"/>
  <text x="1572" y="1000" font-size="12">dbt</text>
  <rect x="1550" y="1010" width="14" height="14" fill="#336791"/>
  <text x="1572" y="1022" font-size="12">Source DB</text>

</svg>
